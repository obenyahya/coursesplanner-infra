# Point d'entrée Flux du cluster dev : synchronise k8s/platform depuis le dépôt
# (source "flux-system" créée par flux bootstrap).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/platform
  # Un objet supprimé du dépôt est aussi supprimé du cluster : Git reste la seule vérité
  prune: true
  # Attendre que les objets soient prêts avant de déclarer "platform" Ready :
  # apps ne démarre qu'une fois le namespace et le CronJob en place.
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
