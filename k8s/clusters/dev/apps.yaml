apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/apps
  prune: true
  # Les applications ont besoin du namespace et du Secret de pull fournis par platform
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: flux-system
